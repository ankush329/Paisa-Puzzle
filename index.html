<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paisa Puzzle India</title>
    <style>
        html {
            height: 100%;
            background: #0f2027;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .wallet {
            background: #ffd700;
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .level-title {
            font-size: 16px;
            color: #00ffcc;
        }
        .puzzle-box {
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            text-align: left;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: rgba(0, 255, 204, 0.2);
            border-color: #00ffcc;
        }
        .hint-box {
            font-size: 13px;
            color: #ffeb3b;
            margin-top: 10px;
        }
        .message {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="level-title" id="categoryTitle">Category</div>
            <div class="wallet" id="walletBalance">🪙 Coins: 100</div>
        </header>

        <div class="puzzle-box" id="questionText">
            लोड हो रहा है...
        </div>

        <div class="options-list" id="optionsContainer">
            <!-- Options will load dynamically -->
        </div>

        <div class="hint-box" id="hintText"></div>
        <div class="message" id="messageBox"></div>
    </div>

    <script>
        const gameData = [
            {
                category: "Number Puzzle",
                question: "2, 4, 8, 16, ?",
                options: ["20", "24", "32", "36"],
                answer: 2,
                hint: "हर बार संख्या को 2 से गुणा किया गया है।"
            },
            {
                category: "Logic",
                question: "एक कमरे में 5 मोमबत्तियाँ थीं। 2 बुझ गईं। कितनी बचीं?",
                options: ["2", "3", "5", "0"],
                answer: 2,
                hint: "बुझी हुई मोमबत्तियाँ भी कमरे में मौजूद हैं।"
            },
            {
                category: "Number Puzzle",
                question: "3, 6, 11, 18, 27, ?",
                options: ["36", "38", "40", "42"],
                answer: 1,
                hint: "+3, +5, +7, +9..."
            },
            {
                category: "Observation",
                question: "इनमें अलग कौन है?",
                options: ["Apple", "Mango", "Banana", "Carrot"],
                answer: 3,
                hint: "तीन फल हैं, एक सब्जी है।"
            },
            {
                category: "Logic",
                question: "अगर आज सोमवार है, तो 3 दिन बाद कौन सा दिन होगा?",
                options: ["मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार"],
                answer: 2,
                hint: "सोमवार के बाद 1 = मंगलवार।"
            },
            {
                category: "Number Puzzle",
                question: "10 + 10 ÷ 2 = ?",
                options: ["10", "15", "20", "25"],
                answer: 1,
                hint: "पहले भाग करें।"
            }
        ];

        let currentLevel = 0;
        let coins = 100;

        function loadQuestion() {
            if (currentLevel < gameData.length) {
                let currentQ = gameData[currentLevel];
                document.getElementById("categoryTitle").innerText = "Level " + (currentLevel + 1) + " (" + currentQ.category + ")";
                document.getElementById("questionText").innerText = currentQ.question;
                document.getElementById("hintText.innerText") = "";
                document.getElementById("messageBox").innerText = "";
                
                let optionsHtml = "";
                for (let i = 0; i < currentQ.options.length; i++) {
                    optionsHtml += `<button class="option-btn" onclick="checkAnswer(${i})">${i + 1}. ${currentQ.options[i]}</button>`;
                }
                document.getElementById("optionsContainer").innerHTML = optionsHtml;
                document.getElementById("hintText").innerText = "💡 हिंट: " + currentQ.hint;
            } else {
                document.getElementById("categoryTitle").innerText = "समाप्त!";
                document.getElementById("questionText").innerText = "🎉 बधाई हो! आपने सभी पहेलियां सफलतापूर्वक हल कर लीं!";
                document.getElementById("optionsContainer").innerHTML = "";
                document.getElementById("hintText").innerText = "";
            }
        }

        function checkAnswer(selectedIndex) {
            let currentQ = gameData[currentLevel];
            let msgBox = document.getElementById("messageBox");

            if (selectedIndex === currentQ.answer) {
                coins += 20;
                document.getElementById("walletBalance").innerText = "🪙 Coins: " + coins;
                msgBox.style.color = "#00ffcc";
                msgBox.innerText = "सही जवाब! +20 सिक्के मिले 🎉";
                currentLevel++;
                setTimeout(loadQuestion, 1500);
            } else {
                msgBox.style.color = "#ff4d4d";
                msgBox.innerText = "गलत जवाब! दोबारा कोशिश करें ❌";
            }
        }

        loadQuestion();
    </script>
</body>
</html>
